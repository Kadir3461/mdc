<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Background -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A3E0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Building with sparkle -->
  <g>
    <!-- Building -->
    <rect x="10" y="15" width="25" height="35" fill="url(#gradient1)" rx="2"/>
    <rect x="14" y="20" width="4" height="4" fill="white" opacity="0.8"/>
    <rect x="21" y="20" width="4" height="4" fill="white" opacity="0.8"/>
    <rect x="14" y="27" width="4" height="4" fill="white" opacity="0.8"/>
    <rect x="21" y="27" width="4" height="4" fill="white" opacity="0.8"/>
    <rect x="14" y="34" width="4" height="4" fill="white" opacity="0.8"/>
    <rect x="21" y="34" width="4" height="4" fill="white" opacity="0.8"/>
    <rect x="17" y="42" width="6" height="8" fill="white" opacity="0.9"/>
    
    <!-- Sparkle/Shine effect -->
    <circle cx="38" cy="15" r="3" fill="#FFB81C"/>
    <line x1="38" y1="10" x2="38" y2="20" stroke="#FFB81C" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="33" y1="15" x2="43" y2="15" stroke="#FFB81C" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="34.5" y1="11.5" x2="41.5" y2="18.5" stroke="#FFB81C" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <line x1="41.5" y1="11.5" x2="34.5" y2="18.5" stroke="#FFB81C" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- Text: MDC -->
  <text x="50" y="28" font-family="'Poppins', 'Arial Black', sans-serif" font-size="22" font-weight="800" fill="#0066CC">MDC</text>
  
  <!-- Text: Facility & Cleaning -->
  <text x="50" y="43" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="600" fill="#4A4A4A">Facility & Cleaning</text>
  
  <!-- Tagline -->
  <text x="50" y="53" font-family="'Inter', Arial, sans-serif" font-size="7" font-weight="400" fill="#6B6B6B" letter-spacing="0.5">Professionelle Reinigung München</text>
</svg>
